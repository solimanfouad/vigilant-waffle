<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Media Downloader</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0f14;color:#f5f6f8}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 20% 0,#263044,#0d0f14 48%);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{width:min(620px,100%);margin:auto;padding:34px 0}h1{font-size:34px;margin:0 0 7px}.sub{color:#aab1bf;margin-bottom:24px}
.card{background:#161920dd;backdrop-filter:blur(18px);border:1px solid #2c303b;border-radius:24px;padding:18px;box-shadow:0 18px 70px #0006}
.types{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}.types button{margin:0}
button,input{width:100%;border-radius:14px;padding:14px;font:inherit}
button{border:0;background:#fff;color:#111;font-weight:750;cursor:pointer;transition: opacity 0.2s}
button:disabled{opacity:0.5;cursor:not-allowed}
button.secondary,.types button{background:#262b36;color:#fff}.types button.active{background:#fff;color:#111}
input{background:#0d1016;border:1px solid #343945;color:#fff;margin-bottom:13px;outline:none}label{font-size:13px;color:#b7beca;display:block;margin-bottom:7px}
#status{margin-top:15px;color:#cbd0da;line-height:1.45;white-space:pre-wrap; font-size: 14px;}
.progress{height:8px;background:#2a2f3a;border-radius:20px;overflow:hidden;margin-top:12px}
.bar{height:100%;width:0;background:#4ade80;transition:width .3s ease-out}
a.save{display:block;text-decoration:none;text-align:center;background:#5e8cff;color:#fff;border-radius:14px;padding:14px;font-weight:750;margin-top:14px}
a.fallback{background:#f59e0b;} /* Orange for fallback */
#settings{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #2c303b}.hint{font-size:12px;color:#858d9b;line-height:1.45;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Media Downloader</h1>
<div class="sub">Direct-to-API iPhone downloader</div>
<section class="card">
<div class="types">
<button class="type active" data-kind="video">Video</button>
<button class="type" data-kind="music">Music</button>
<button class="type" data-kind="other">Other</button>
</div>
<label>Media URL</label>
<input id="url" type="url" inputmode="url" placeholder="YouTube, TikTok, Vimeo, Instagram…" autocomplete="url" spellcheck="false">
<label>File name (optional)</label>
<input id="name" placeholder="My download">
<button id="download">Download Media</button>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="status">Ready</div>
<a id="save" class="save" hidden>Save file</a>

<button id="settingsButton" class="secondary" style="margin-top: 24px;">API Settings</button>
<div id="settings">
<label>API username</label><input id="user" autocomplete="off">
<label>API password</label><input id="pass" type="password" autocomplete="off">
<button id="saveSettings">Save settings</button>
<div class="hint">Because this is a serverless PWA, the API credentials must be available in the browser. That means they are not secret.</div>
</div>
</section>
</main>

<script type="module">
const $ = id => document.getElementById(id);
let kind = "video";

// Handle UI Selection
document.querySelectorAll(".type").forEach(b => b.onclick = () => {
  document.querySelectorAll(".type").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); 
  kind = b.dataset.kind;
});

$("settingsButton").onclick = () => {
  $("settings").style.display = $("settings").style.display === "none" ? "block" : "none";
};

$("user").value = localStorage.getItem("apiUser") || "user_8f0c95e6";
$("pass").value = localStorage.getItem("apiPass") || "bGkrl6aX";

$("saveSettings").onclick = () => {
  localStorage.setItem("apiUser", $("user").value.trim());
  localStorage.setItem("apiPass", $("pass").value);
  $("status").textContent = "API settings saved.";
};

function auth() {
  const u = $("user").value.trim(), p = $("pass").value;
  return "Basic " + btoa(unescape(encodeURIComponent(u + ":" + p)));
}

// ---------------------------------------------------------
// API WRAPPER WITH STRICT DIAGNOSTICS
// ---------------------------------------------------------
async function api(path, opt = {}) {
  const url = `https://gate.apiscrape.net:16262/api${path}`;
  const headers = { ...(opt.headers || {}), Authorization: auth() };
  
  try {
    const r = await fetch(url, { ...opt, headers });
    const text = await r.text();
    if(!r.ok) throw new Error(text.slice(0, 100));
    return JSON.parse(text);
  } catch (err) {
    if (err.name === 'TypeError' || err.message.includes('NetworkError')) {
      throw new Error(`[API CORS BLOCK]: The API server refused the browser connection. (${err.message})`);
    }
    throw err;
  }
}

// ---------------------------------------------------------
// MEDIA FETCHER (With Fallback Trigger)
// ---------------------------------------------------------
async function getBlob(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.blob();
  } catch (err) {
    console.error(err);
    throw new Error("MEDIA_CORS_ERROR"); // Trigger the escape hatch
  }
}

// Format Extractors
function formatsOf(x) { return Array.isArray(x) ? x : (x.formats || x.data || []) }
function n(v) { return Number(v) || 0 }
function videoFormats(a) { return a.filter(x => n(x.height) > 0 || String(x.vcodec || "").toLowerCase() !== "none") }
function audioFormats(a) { return a.filter(x => String(x.acodec || "").toLowerCase() !== "none" || String(x.vcodec || "").toLowerCase() === "none") }

function bestVideo(a) { return videoFormats(a).sort((x, y) => n(y.height) - n(x.height) || n(y.fps) - n(x.fps))[0] }
function bestAudio(a) { return audioFormats(a).sort((x, y) => n(y.abr) - n(x.abr) || n(y.audio_bitrate) - n(x.audio_bitrate))[0] }
function bestCombined(a) { return a.filter(x => String(x.acodec||"").toLowerCase() !== "none" && String(x.vcodec||"").toLowerCase() !== "none").sort((x, y) => n(y.height) - n(x.height))[0] }

function idOf(x) { return x.format_id ?? x.formatId ?? x.id }
function taskId(x) { return x.task_id || x.taskId || x.id || x.data?.task_id || x.data?.id }
function safe(s) { return String(s || "download").replace(/[<>:"/\\\\|?*\\x00-\\x1F]/g, "_").trim().slice(0, 100) || "download" }

// API Interactions
async function wait(id) {
  for(let i=0; i<60; i++){
    const s = await api(`/status/${encodeURIComponent(id)}`);
    const st = String(s.status || s.state || s.data?.status || "").toLowerCase();
    if(["finished","completed","complete","success","done"].includes(st)) return s;
    if(["failed","error","cancelled","canceled"].includes(st)) throw new Error(s.error || s.message || "Task failed remotely");
    $("status").textContent = `Server processing...`;
    await new Promise(r => setTimeout(r, 2000));
  }
  throw new Error("Task timed out.");
}

async function task(url, formatId) {
  return api(`/download`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url, format_id: String(formatId) }) });
}

async function finishedUrl(id) {
  const x = await api(`/download/${encodeURIComponent(id)}`);
  return x.download_url || x.url || x.file_url || x.data?.download_url || x.data?.url;
}

// ---------------------------------------------------------
// FFMPEG CONVERSION ENGINE
// ---------------------------------------------------------
let ffmpeg = null;
async function loadFFmpeg() {
  if(ffmpeg) return ffmpeg;
  $("status").textContent = "Loading converter engine...";
  const mod = await import("https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js");
  ffmpeg = new mod.FFmpeg();
  
  ffmpeg.on('progress', ({ progress }) => {
    $("bar").style.width = `${60 + (Math.round(progress * 100) * 0.35)}%`; 
  });

  await ffmpeg.load({
    coreURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.js",
    wasmURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.wasm"
  });
  return ffmpeg;
}

async function convertMusic(audioUrl) {
  const f = await loadFFmpeg();
  $("status").textContent = "Downloading raw audio to device...";
  const blob = await getBlob(audioUrl);
  
  await f.writeFile("input", new Uint8Array(await blob.arrayBuffer()));
  $("status").textContent = "Converting audio to MP3...";
  await f.exec(["-i", "input", "-vn", "-codec:a", "libmp3lame", "-b:a", "192k", "output.mp3"]);
  
  const data = await f.readFile("output.mp3");
  await f.deleteFile("input"); 
  return new Blob([data.buffer], { type: "audio/mpeg" });
}

async function mux(videoUrl, audioUrl) {
  const f = await loadFFmpeg();
  $("status").textContent = "Downloading separate video & audio streams...";
  
  const [vb, ab] = await Promise.all([getBlob(videoUrl), getBlob(audioUrl)]);
  await f.writeFile("video", new Uint8Array(await vb.arrayBuffer()));
  await f.writeFile("audio", new Uint8Array(await ab.arrayBuffer()));
  
  $("status").textContent = "Merging Video & Audio (This takes a moment)...";
  await f.exec(["-i", "video", "-i", "audio", "-map", "0:v:0", "-map", "1:a:0", "-c:v", "copy", "-c:a", "aac", "-b:a", "192k", "-movflags", "+faststart", "output.mp4"]);
  
  const data = await f.readFile("output.mp4");
  await f.deleteFile("video");
  await f.deleteFile("audio");
  
  return new Blob([data.buffer], { type: "video/mp4" });
}

function offerBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  $("save").href = url;
  $("save").download = filename;
  $("save").textContent = "Save " + filename;
  $("save").className = "save";
  $("save").hidden = false;
  $("bar").style.width = "100%";
  $("status").textContent = "Finished! Tap to save.";
}

// THE ESCAPE HATCH: If the browser blocks FFmpeg, give them a direct link.
function offerDirectLink(url, filename) {
  $("save").href = url;
  $("save").download = filename; // Note: Cross-origin downloads might just open in a new tab on iOS, which allows manual saving.
  $("save").target = "_blank";
  $("save").textContent = "Native Download: " + filename;
  $("save").className = "save fallback";
  $("save").hidden = false;
  $("bar").style.width = "100%";
  $("status").textContent = "Browser security blocked the converter. Tap the orange button to open/download the raw file directly.";
}


// ---------------------------------------------------------
// MAIN DOWNLOAD LOGIC
// ---------------------------------------------------------
$("download").onclick = async () => {
  $("save").hidden = true; 
  $("save").target = "_self";
  $("bar").style.width = "0%";
  
  try {
    const url = $("url").value.trim();
    if(!/^https?:\/\//i.test(url)) throw new Error("Please paste a valid link starting with http.");
    
    $("download").disabled = true;
    $("status").textContent = "Connecting to API server…";
    $("bar").style.width = "5%";
    
    const data = await api(`/formats?video_url=${encodeURIComponent(url)}`);
    const fs = formatsOf(data);
    
    if (kind === "music") {
      const a = bestAudio(fs);
      if(!a) throw new Error("No audio format found.");
      
      $("status").textContent = "Requesting audio extraction…"; $("bar").style.width = "15%";
      const t = await task(url, idOf(a)), tid = taskId(t);
      await wait(tid); $("bar").style.width = "40%";
      const u = await finishedUrl(tid);
      
      try {
        const blob = await convertMusic(u);
        offerBlob(blob, safe($("name").value || "music") + ".mp3");
      } catch (err) {
        if (err.message === "MEDIA_CORS_ERROR") offerDirectLink(u, safe($("name").value || "music") + "_raw_audio");
        else throw err;
      }

    } else if (kind === "other") {
      let fmt = bestCombined(fs) || bestVideo(fs);
      if(!fmt) throw new Error("No formats found.");
      
      $("status").textContent = "Requesting video file…"; $("bar").style.width = "20%";
      const t = await task(url, idOf(fmt)), tid = taskId(t);
      await wait(tid); $("bar").style.width = "50%";
      const u = await finishedUrl(tid);
      
      try {
        $("status").textContent = "Downloading final file to device...";
        const blob = await getBlob(u); 
        offerBlob(blob, safe($("name").value || "download") + ".mp4");
      } catch (err) {
         if (err.message === "MEDIA_CORS_ERROR") offerDirectLink(u, safe($("name").value || "video") + ".mp4");
         else throw err;
      }

    } else {
      const a = bestAudio(fs), v = bestVideo(fs);
      if(!v || !a) throw new Error("Could not find separate video/audio tracks.");
      
      $("status").textContent = "Requesting high-quality tracks…"; $("bar").style.width = "10%";
      const [vt, at] = await Promise.all([task(url, idOf(v)), task(url, idOf(a))]);
      const vi = taskId(vt), ai = taskId(at);
      
      await Promise.all([wait(vi), wait(ai)]); $("bar").style.width = "40%";
      const [vu, au] = await Promise.all([finishedUrl(vi), finishedUrl(ai)]);
      
      try {
        const blob = await mux(vu, au);
        offerBlob(blob, safe($("name").value || "video") + ".mp4");
      } catch (err) {
        if (err.message === "MEDIA_CORS_ERROR") {
          // If merging fails due to CORS, offer just the video as a fallback
          offerDirectLink(vu, safe($("name").value || "video") + "_no_audio.mp4");
        } else throw err;
      }
    }
  } catch (e) {
    console.error(e);
    $("status").textContent = "Error: " + e.message;
    $("bar").style.width = "0%";
  } finally {
    $("download").disabled = false;
  }
};
</script>
</body>
</html>
