<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Media Downloader</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0f14;color:#f5f6f8}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 20% 0,#263044,#0d0f14 48%);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{width:min(620px,100%);margin:auto;padding:34px 0}h1{font-size:34px;margin:0 0 7px}.sub{color:#aab1bf;margin-bottom:24px}
.card{background:#161920dd;backdrop-filter:blur(18px);border:1px solid #2c303b;border-radius:24px;padding:18px;box-shadow:0 18px 70px #0006}
.types{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}.types button{margin:0}
button,input{width:100%;border-radius:14px;padding:14px;font:inherit}button{border:0;background:#fff;color:#111;font-weight:750;cursor:pointer}button.secondary,.types button{background:#262b36;color:#fff}.types button.active{background:#fff;color:#111}
input{background:#0d1016;border:1px solid #343945;color:#fff;margin-bottom:13px;outline:none}label{font-size:13px;color:#b7beca;display:block;margin-bottom:7px}
#status{margin-top:15px;color:#cbd0da;line-height:1.45;white-space:pre-wrap}.progress{height:8px;background:#2a2f3a;border-radius:20px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#fff;transition:width .2s}
a.save{display:block;text-decoration:none;text-align:center;background:#5e8cff;color:#fff;border-radius:14px;padding:14px;font-weight:750;margin-top:14px}
#settings{display:none;margin-top:12px}.hint{font-size:12px;color:#858d9b;line-height:1.45;margin-top:10px}
#formats{display:none;margin-top:15px}.format{padding:12px;background:#20242e;border-radius:12px;margin-top:7px;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Media Downloader</h1>
<div class="sub">Direct-to-API iPhone downloader</div>
<section class="card">
<div class="types">
<button class="type active" data-kind="video">Video</button>
<button class="type" data-kind="music">Music</button>
<button class="type" data-kind="other">Other</button>
</div>
<label>Media URL</label>
<input id="url" type="url" inputmode="url" placeholder="YouTube, TikTok, Vimeo, Instagram…" autocomplete="url" spellcheck="false">
<label>File name (optional)</label>
<input id="name" placeholder="My download">
<button id="download">Download</button>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="status"></div>
<a id="save" class="save" hidden>Save file</a>
<button id="settingsButton" class="secondary">API Settings</button>
<div id="settings">
<label>API username</label><input id="user" autocomplete="off">
<label>API password</label><input id="pass" type="password" autocomplete="off">
<button id="saveSettings">Save settings</button>
<div class="hint">Because this is a serverless PWA, the API credentials must be available in the browser. That means they are not secret. If the API blocks browser CORS requests, this architecture cannot work until the API provider enables CORS.</div>
</div>
<div id="formats"></div>
</section>
</main>

<script type="module">
const API="https://gate.apiscrape.net:16262/api";
const $=id=>document.getElementById(id);
let kind="video";

document.querySelectorAll(".type").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".type").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); kind=b.dataset.kind;
});

$("settingsButton").onclick=()=>{$("settings").style.display=$("settings").style.display==="none"?"block":"none"};
$("user").value=localStorage.getItem("apiUser")||"";
$("pass").value=localStorage.getItem("apiPass")||"";
$("saveSettings").onclick=()=>{
  localStorage.setItem("apiUser",$("user").value.trim());
  localStorage.setItem("apiPass",$("pass").value);
  $("status").textContent="API settings saved on this device.";
};

function auth(){
  const u=$("user").value.trim(), p=$("pass").value;
  if(!u||!p) throw new Error("Open API Settings and enter your API credentials first.");
  return "Basic "+btoa(unescape(encodeURIComponent(u+":"+p)));
}
async function api(url,opt={}){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:auth()}});
  const text=await r.text();
  if(!r.ok) throw new Error("API "+r.status+": "+text.slice(0,300));
  try{return JSON.parse(text)}catch{return text}
}
function formatsOf(x){return Array.isArray(x)?x:(x.formats||x.data||[])}
function n(v){return Number(v)||0}
function videoFormats(a){return a.filter(x=>n(x.height)>0 || String(x.vcodec||"").toLowerCase()!=="none")}
function audioFormats(a){return a.filter(x=>String(x.acodec||"").toLowerCase()!=="none" || String(x.vcodec||"").toLowerCase()==="none")}
function bestVideo(a){return videoFormats(a).sort((x,y)=>n(y.height)-n(x.height)||n(y.fps)-n(x.fps))[0]}
function bestAudio(a){return audioFormats(a).sort((x,y)=>n(y.abr)-n(x.abr)||n(y.audio_bitrate)-n(x.audio_bitrate))[0]}
function idOf(x){return x.format_id??x.formatId??x.id}
function taskId(x){return x.task_id||x.taskId||x.id||x.data?.task_id||x.data?.id}
function safe(s){return String(s||"download").replace(/[<>:"/\\\\|?*\\x00-\\x1F]/g,"_").trim().slice(0,100)||"download"}
async function wait(id){
  for(let i=0;i<600;i++){
    const s=await api(`${API}/status/${encodeURIComponent(id)}`);
    const st=String(s.status||s.state||s.data?.status||"").toLowerCase();
    if(["finished","completed","complete","success","done"].includes(st)) return s;
    if(["failed","error","cancelled","canceled"].includes(st)) throw new Error(s.error||s.message||"API task failed");
    $("status").textContent=`Waiting for API task ${id}…`;
    await new Promise(r=>setTimeout(r,1500));
  }
  throw new Error("API task timed out.");
}
async function task(url,formatId){
  return api(`${API}/download`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,format_id:String(formatId)})});
}
async function finishedUrl(id){
  const x=await api(`${API}/download/${encodeURIComponent(id)}`);
  return x.download_url||x.url||x.file_url||x.data?.download_url||x.data?.url;
}

let ffmpeg=null;
async function loadFFmpeg(){
  if(ffmpeg) return ffmpeg;
  $("status").textContent="Loading browser converter…";
  const mod=await import("https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js");
  const util=await import("https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js");
  ffmpeg=new mod.FFmpeg();
  ffmpeg.util=util;
  await ffmpeg.load({
    coreURL:"https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.js",
    wasmURL:"https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm/ffmpeg-core.wasm"
  });
  return ffmpeg;
}
async function getBlob(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error("Could not fetch the finished media URL. The API's download URL may not allow browser CORS.");
  return await r.blob();
}
async function convertMusic(audioUrl,name){
  const f=await loadFFmpeg(), blob=await getBlob(audioUrl);
  await f.writeFile("input",new Uint8Array(await blob.arrayBuffer()));
  await f.exec(["-i","input","-vn","-codec:a","libmp3lame","-b:a","192k","output.mp3"]);
  const data=await f.readFile("output.mp3");
  return new Blob([data.buffer],{type:"audio/mpeg"});
}
async function mux(videoUrl,audioUrl){
  const f=await loadFFmpeg(), [vb,ab]=await Promise.all([getBlob(videoUrl),getBlob(audioUrl)]);
  await f.writeFile("video",new Uint8Array(await vb.arrayBuffer()));
  await f.writeFile("audio",new Uint8Array(await ab.arrayBuffer()));
  await f.exec(["-i","video","-i","audio","-map","0:v:0","-map","1:a:0","-c:v","copy","-c:a","aac","-b:a","192k","-movflags","+faststart","output.mp4"]);
  const data=await f.readFile("output.mp4");
  return new Blob([data.buffer],{type:"video/mp4"});
}
function offer(blob,filename){
  const url=URL.createObjectURL(blob);
  $("save").href=url;$("save").download=filename;$("save").textContent="Save "+filename;$("save").hidden=false;
}
$("download").onclick=async()=>{
  $("save").hidden=true;$("bar").style.width="0%";
  try{
    const url=$("url").value.trim();
    if(!/^https?:\\/\\//i.test(url)) throw new Error("Enter a valid URL.");
    $("download").disabled=true;
    $("status").textContent="Getting available formats…";
    const data=await api(`${API}/formats?video_url=${encodeURIComponent(url)}`);
    const fs=formatsOf(data), a=bestAudio(fs), v=bestVideo(fs);
    if(!a) throw new Error("The API returned no usable audio format.");
    if(kind==="music"){
      $("status").textContent="Creating audio download task…"; $("bar").style.width="15%";
      const t=await task(url,idOf(a)), tid=taskId(t); if(!tid) throw new Error("No task ID returned.");
      await wait(tid); $("bar").style.width="55%";
      const u=await finishedUrl(tid); if(!u) throw new Error("No finished audio URL returned.");
      const blob=await convertMusic(u); $("bar").style.width="95%";
      offer(blob,safe($("name").value||"music")+".mp3");
    }else{
      if(!v) throw new Error("The API returned no usable video format.");
      $("status").textContent="Creating separate video + audio tasks…"; $("bar").style.width="10%";
      const [vt,at]=await Promise.all([task(url,idOf(v)),task(url,idOf(a))]);
      const vi=taskId(vt), ai=taskId(at); if(!vi||!ai) throw new Error("The API did not return both task IDs.");
      await Promise.all([wait(vi),wait(ai)]); $("bar").style.width="55%";
      const [vu,au]=await Promise.all([finishedUrl(vi),finishedUrl(ai)]);
      if(!vu||!au) throw new Error("Missing video/audio download URL.");
      const blob=await mux(vu,au); $("bar").style.width="95%";
      offer(blob,safe($("name").value||"video")+".mp4");
    }
    $("bar").style.width="100%";$("status").textContent="Finished. Tap Save file.";
  }catch(e){
    console.error(e);
    $("status").textContent="Error: "+e.message;
  }finally{$("download").disabled=false}
};
</script>
</body>
</html>
